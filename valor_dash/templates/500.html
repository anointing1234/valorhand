<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>500 - Page Not Found</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet" />
    <style>
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        background-color: #f8f9fa;
      }
      .error-container {
        text-align: center;
      }
      .error-code {
        font-size: 10rem;
        font-weight: bold;
        color: #dc3545;
      }
      .error-message {
        font-size: 1.25rem;
        color: #6c757d;
      }
      .btn-home {
        margin-top: 1.5rem;
      }
    </style>
  </head>
  <body>
    <div class="error-container">
      <div class="error-code">500</div>
      <h1 class="display-5 fw-bold">Server error something went wrong</h1>
      <p class="error-message">The page you are looking for does not exist or may have been moved.</p>
      <a href="/" class="btn btn-primary btn-home">Go Back to Homepage</a>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
